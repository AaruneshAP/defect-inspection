name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      # CPU-only torch first (pinned version is satisfied by the +cpu build); avoids ~2 GB of CUDA wheels.
      - name: Install CPU torch
        run: pip install torch==2.13.0 torchvision==0.28.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      # data/, data/cache/ and models/ are git-ignored, so tests marked requires_* are skipped here.
      - name: Pytest
        run: pytest -rs

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: defect-inspection:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # No weights are mounted: /health must still answer, /predict must return 503.
      - name: Container smoke test
        run: |
          docker run -d --name api -p 8000:8000 defect-inspection:ci
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/health | grep -q '"model_loaded":false'
          curl -sf http://127.0.0.1:8000/model-info | grep -q '"policy"'
          code=$(curl -s -o /dev/null -w '%{http_code}' -F 'files=@README.md;type=image/png' http://127.0.0.1:8000/predict)
          test "$code" = "503"
          docker exec api id -u | grep -qv '^0$'

      - name: Container logs on failure
        if: failure()
        run: docker logs api
